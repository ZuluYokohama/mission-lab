name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check public files, licenses, provenance and documentation links
        run: python -B tools/check_repository.py
      - name: Check guard failure cases
        run: python -B -m unittest discover -s tools/tests -v

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run package tests sequentially
        run: python -B -m pytest research/mission_lab_v0_1/tests -q -p no:cacheprovider
      - name: Validate the fixture specification
        run: python -B -m research.mission_lab_v0_1 validate --mission research/mission_lab_v0_1/fixtures/mission.json
      - name: Generate a temporary seal key
        run: python -B tools/ci_seal_key.py
      - name: Execute baseline and tighter-budget revision
        run: python -B -m research.mission_lab_v0_1 demo --out evidence/ci_demo
      - name: Replay baseline evidence
        run: python -B -m research.mission_lab_v0_1 replay --run research/mission_lab_v0_1/evidence/ci_demo/baseline_run
      - name: Replay revised evidence
        run: python -B -m research.mission_lab_v0_1 replay --run research/mission_lab_v0_1/evidence/ci_demo/revised_run
      - name: Ensure execution preserved tracked files
        run: git diff --exit-code

  stonx_chart:
    name: StonX chart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stonx_chart/web/package-lock.json
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run feed tests
        run: python -B -m pytest stonx_chart/feed/tests -q -p no:cacheprovider
      - name: Install web dependencies
        working-directory: stonx_chart/web
        run: npm ci
      - name: Type-check the chart
        working-directory: stonx_chart/web
        run: npm run typecheck
      - name: Run chart unit tests
        working-directory: stonx_chart/web
        run: npm test
      - name: Install Playwright Chromium
        working-directory: stonx_chart/web
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end checks
        working-directory: stonx_chart/web
        env:
          STONX_PYTHON: python
        run: npm run e2e
